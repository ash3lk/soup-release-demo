name: Wheel CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      wheel_id: ${{ steps.wheel.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.4
      - run: ruff check src scripts tests
      - run: python -m pip install build
      - run: python -m build
      - name: Check tag against wheel metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release.py dist "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        id: wheel
        with:
          name: wheel-${{ github.run_attempt }}
          path: dist/*.whl
          if-no-files-found: error

  test-wheel:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.wheel_id }}
          path: dist/
      - run: python scripts/check_wheel.py dist

  docker-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.wheel_id }}
          path: dist/
      - run: docker build -t soup-demo-ci .
      - run: docker run --rm --network none soup-demo-ci

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test-wheel, docker-smoke]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.wheel_id }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
